[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tark-nrc-chiller"
version = "0.1.0"
description = "NRC400 chiller controller with a local dashboard and offline simulator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5,<4", "dash>=3,<4", "plotly>=6,<7"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
tark-nrc = "tark_nrc.gui:main"

[tool.uv]
default-groups = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tark_nrc = ["assets/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
